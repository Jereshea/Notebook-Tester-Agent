# Full permission for the notebook agents, with one hard limit: no writes to GitHub.
# Hermes applies `deny` rules before everything else, even with approvals turned off.
approvals:
  mode: 'off'                  # no approval prompts / built-in dangerous-command checks
  unattended_mode: approve     # background (kanban) runs may do anything not denied below
  single_query_mode: approve
  cron_mode: approve
  deny:
    # --- git: never record or publish changes ---
    - '*git commit*'
    - '*git * commit*'
    - '*git push*'
    - '*git * push*'
    - '*git tag *'
    - '*git * tag *'
    - '*git remote set-url --push origin http*'
    - '*git remote set-url --push origin git@*'
    # --- GitHub CLI: no pull requests, reviews, comments, issues, releases or repo changes ---
    - '*gh pr create*'
    - '*gh pr merge*'
    - '*gh pr review*'
    - '*gh pr comment*'
    - '*gh pr edit*'
    - '*gh pr close*'
    - '*gh pr reopen*'
    - '*gh pr ready*'
    - '*gh issue create*'
    - '*gh issue comment*'
    - '*gh issue edit*'
    - '*gh issue close*'
    - '*gh release *'
    - '*gh repo create*'
    - '*gh repo edit*'
    - '*gh repo delete*'
    - '*gh repo fork*'
    - '*gh repo sync*'
    - '*gh workflow run*'
    - '*gh secret *'
    - '*gh gist create*'
    - '*gh auth login*'
    - '*gh auth logout*'
    - '*gh auth refresh*'
    - '*gh auth token*'
    - '*gh auth setup-git*'
    # --- GitHub API: only reads (GET) are allowed ---
    - '*gh api*-x*'
    - '*gh api*--method*'
    - '*gh api*-f *'
    - '*gh api*--field*'
    - '*gh api*--raw-field*'
    - '*gh api*--input*'
    # direct HTTP calls to the GitHub API: reads (GET) are fine, anything that sends data or changes something is not
    - '*api.github.com*-x *'
    - '*-x * *api.github.com*'
    - '*api.github.com*--request*'
    - '*--request*api.github.com*'
    - '*api.github.com*-d *'
    - '* -d *api.github.com*'
    - '*api.github.com*--data*'
    - '*--data*api.github.com*'
    - '*api.github.com*--json*'
    - '*--json*api.github.com*'
    - '*post*api.github.com*'
    - '*api.github.com*post*'
    - '*patch*api.github.com*'
    - '*api.github.com*patch*'
    - '*put *api.github.com*'
    - '*api.github.com*put *'
    - '*delete*api.github.com*'
    - '*api.github.com*delete*'
    # --- never read or copy the GitHub token ---
    - '*hosts.yml*'
    - '*.config/gh*'
    - '*gh_token*'
    - '*github_token*'
